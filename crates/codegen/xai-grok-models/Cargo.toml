[package]
license = "Apache-2.0"
name = "xai-grok-models"
version = "0.1.0"
edition.workspace = true
description = "Default model IDs and shipped models.dev catalog for the grok CLI."

[features]
default = []
# Optional blocking HTTP refresh of https://models.dev/api.json
fetch = ["dep:reqwest"]

[dependencies]
flate2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true, optional = true }

[lints]
workspace = true
